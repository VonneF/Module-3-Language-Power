<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module 3: Language That Tightens vs. Softens | Healing with Yvonne</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and ReactDOM CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for processing JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #fcfdfc; color: #1f2937; }
        
        /* Specialized PDF/Print Styling */
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; padding: 0 !important; }
            .print-block { 
                display: block !important; 
                margin-top: 1rem; 
                border: 1px solid #e5e7eb !important; 
                border-radius: 1.5rem !important; 
                padding: 2.5rem !important; 
                box-shadow: none !important;
                page-break-inside: avoid;
            }
            .container-box { 
                box-shadow: none !important; 
                border: none !important; 
                width: 100% !important; 
                max-width: 100% !important; 
                padding: 0 !important;
            }
        }
        
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        
        .soften-transition { transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const App = () => {
            const [step, setStep] = useState(0);
            const [activeCategory, setActiveCategory] = useState(null);
            
            // Worksheet State
            const [formData, setFormData] = useState({
                tightened: '',
                softened: '',
                bodyResponse: '',
                practiceEntries: [
                    { tight: '', soft: '', sensation: '' }
                ]
            });

            const goTo = (s) => { 
                setStep(s); 
                window.scrollTo(0, 0); 
            };

            const ProgressBar = () => (
                <div className="flex justify-between mb-8 max-w-md mx-auto no-print">
                    {[0, 1, 2, 3, 4, 5].map((i) => (
                        <div key={i} className={`h-1.5 flex-1 mx-1 rounded-full transition-all duration-500 ${step >= i ? 'bg-emerald-600' : 'bg-gray-200'}`} />
                    ))}
                </div>
            );

            return (
                <div className="min-h-screen p-4 sm:p-8">
                    <div className="max-w-3xl mx-auto container-box">
                        
                        {/* Header Branding */}
                        <div className="text-center mb-8 no-print">
                            <p className="text-[10px] font-bold tracking-[0.3em] uppercase text-emerald-600 mb-2">Healing with Yvonne</p>
                            <h1 className="text-3xl sm:text-4xl font-extrabold text-emerald-950 mb-2 leading-tight">Module 3: Language Power</h1>
                            <p className="text-sm italic text-gray-400 font-medium">"Small shifts in language create big shifts in how you feel."</p>
                        </div>

                        <ProgressBar />

                        <div className="bg-white rounded-[2.5rem] shadow-2xl p-8 sm:p-14 border border-emerald-50 min-h-[550px] flex flex-col fade-in">
                            
                            {/* STEP 0: Introduction */}
                            {step === 0 && (
                                <div className="space-y-6">
                                    <h2 className="text-2xl font-bold text-emerald-900">Words Affect Your Body</h2>
                                    
                                    <div className="space-y-4 text-gray-600 leading-relaxed text-lg">
                                        <p>The specific words you use do not just affect your mood. They affect your <strong>physiology.</strong></p>
                                        
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 my-8">
                                            <div className="p-6 bg-red-50 rounded-2xl border border-red-100">
                                                <p className="font-bold text-red-900 mb-2 uppercase text-xs tracking-widest">Tightening Language</p>
                                                <p className="text-sm text-red-800">Activates stress. Makes your body brace for threat. Shoulders rise, jaw clenches.</p>
                                            </div>
                                            <div className="p-6 bg-emerald-50 rounded-2xl border border-emerald-100">
                                                <p className="font-bold text-emerald-900 mb-2 uppercase text-xs tracking-widest">Softening Language</p>
                                                <p className="text-sm text-emerald-800">Signals safety. Helps your nervous system relax. Breath deepens, heart slows.</p>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="bg-amber-50 border-l-4 border-amber-400 p-6 rounded-r-2xl">
                                        <p className="font-bold mb-3 text-amber-900">What we will do:</p>
                                        <ul className="text-sm space-y-2 text-amber-900 list-disc list-inside leading-relaxed">
                                            <li>Identify the 4 categories of language that tighten your system.</li>
                                            <li>Learn the 4 core "Shifts" to soften your internal dialogue.</li>
                                            <li>Practice shifting real-world scenarios side-by-side.</li>
                                            <li>Download a PDF log to share during <span className="font-bold underline">Q & A sessions</span>.</li>
                                        </ul>
                                    </div>
                                    
                                    <button onClick={() => goTo(1)} className="mt-4 w-full bg-emerald-900 text-white font-bold py-5 rounded-2xl shadow-xl hover:bg-emerald-800 transition-all flex items-center justify-center gap-2">
                                        Identify Tightening Language <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clipRule="evenodd" /></svg>
                                    </button>
                                </div>
                            )}

                            {/* STEP 1: Categories of Tightening */}
                            {step === 1 && (
                                <div className="space-y-6">
                                    <h2 className="text-2xl font-bold text-emerald-900">4 Categories That Tighten</h2>
                                    <p className="text-sm text-gray-500 italic">Click a category to see why it activates stress:</p>
                                    
                                    <div className="grid grid-cols-1 gap-3">
                                        {[
                                            { id: 1, t: 'Should / Must / Have To', d: 'Creates urgency and obligation. Your body hears: "You are failing."', b: 'Shoulders raise, jaw clenches.' },
                                            { id: 2, t: 'Always / Never', d: 'Creates hopelessness and permanence. Your body hears: "You are stuck."', b: 'Heaviness, collapse, exhaustion.' },
                                            { id: 3, t: 'Can Not / Impossible', d: 'Creates powerlessness and panic. Your body hears: "I am trapped."', b: 'Constriction, feeling frozen.' },
                                            { id: 4, t: 'What Is Wrong With Me?', d: 'Creates shame and self-rejection. Your body hears: "I am unacceptable."', b: 'Heat in face, wanting to hide.' }
                                        ].map(cat => (
                                            <button 
                                                key={cat.id}
                                                onClick={() => setActiveCategory(activeCategory === cat.id ? null : cat.id)}
                                                className={`p-5 text-left rounded-2xl border transition-all ${activeCategory === cat.id ? 'bg-emerald-900 border-emerald-900' : 'bg-gray-50 border-gray-100 hover:border-emerald-200'}`}
                                            >
                                                <p className={`font-bold uppercase text-[10px] tracking-widest ${activeCategory === cat.id ? 'text-emerald-300' : 'text-emerald-700'}`}>Category {cat.id}</p>
                                                <p className={`font-bold text-lg ${activeCategory === cat.id ? 'text-white' : 'text-emerald-900'}`}>{cat.t}</p>
                                                {activeCategory === cat.id && (
                                                    <div className="mt-4 pt-4 border-t border-emerald-800 text-emerald-100 text-sm space-y-2 fade-in">
                                                        <p><strong>Why it tightens:</strong> {cat.d}</p>
                                                        <p><strong>Somatic feel:</strong> {cat.b}</p>
                                                    </div>
                                                )}
                                            </button>
                                        ))}
                                    </div>

                                    <div className="flex gap-4 pt-6">
                                        <button onClick={() => goTo(0)} className="px-6 py-4 text-gray-400 font-bold hover:text-emerald-900">Back</button>
                                        <button onClick={() => goTo(2)} className="flex-1 bg-emerald-900 text-white font-bold py-5 rounded-2xl hover:bg-emerald-800 shadow-lg">Learn the Softening Shifts</button>
                                    </div>
                                </div>
                            )}

                            {/* STEP 2: The Softening Shifts */}
                            {step === 2 && (
                                <div className="space-y-6">
                                    <h2 className="text-2xl font-bold text-emerald-900">How to Soften the Language</h2>
                                    <p className="text-sm text-gray-500 italic">Signal safety to your nervous system with these 4 shifts:</p>
                                    
                                    <div className="space-y-4">
                                        {[
                                            { from: 'I Should...', to: 'I Notice...', r: 'Removes judgment and creates curiosity.' },
                                            { from: 'I Always...', to: 'Sometimes I...', r: 'Acknowledges reality without making it permanent.' },
                                            { from: 'I Can Not...', to: 'Right Now, I Am...', r: 'Acknowledges the present without locking you into forever.' },
                                            { from: 'What is wrong with me?', to: 'What is happening for me?', r: 'Invites curiosity about your experience instead of shame.' }
                                        ].map((shift, i) => (
                                            <div key={i} className="p-6 bg-emerald-50/50 rounded-3xl border border-emerald-100 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                                                <div className="space-y-1">
                                                    <p className="text-[10px] font-bold text-red-400 uppercase tracking-widest line-through">Instead of: {shift.from}</p>
                                                    <p className="text-lg font-extrabold text-emerald-900">Try: {shift.to}</p>
                                                </div>
                                                <p className="text-xs text-emerald-700 italic font-medium sm:max-w-[200px]">{shift.r}</p>
                                            </div>
                                        ))}
                                    </div>

                                    <div className="flex gap-4 pt-8">
                                        <button onClick={() => goTo(1)} className="px-6 py-4 text-gray-400 font-bold hover:text-emerald-900">Back</button>
                                        <button onClick={() => goTo(3)} className="flex-1 bg-emerald-900 text-white font-bold py-5 rounded-2xl hover:bg-emerald-800 shadow-lg">Side-by-Side Practice</button>
                                    </div>
                                </div>
                            )}

                            {/* STEP 3: Side-by-Side Scenarios */}
                            {step === 3 && (
                                <div className="space-y-6">
                                    <h2 className="text-2xl font-bold text-emerald-900">Real-World Examples</h2>
                                    <div className="space-y-6 max-h-[400px] overflow-y-auto pr-2">
                                        {[
                                            { s: 'Mistake at work', t: '"I always mess things up. I should have known better."', soft: '"I notice I made a mistake. Sometimes that happens. I am learning."' },
                                            { s: 'Anxious about social event', t: '"I should not be this anxious. I have to calm down."', soft: '"I notice I am feeling anxious right now. My body is trying to protect me."' },
                                            { s: 'Someone is upset with you', t: '"I always let people down. I have to fix this immediately."', soft: '"I notice they are upset. I can listen. I do not have to fix everything right now."' },
                                            { s: 'Overwhelmed with tasks', t: '"I have to get this all done today. I should be able to handle it."', soft: '"I notice I am feeling overwhelmed. I can take one thing at a time."' }
                                        ].map((item, i) => (
                                            <div key={i} className="space-y-3 p-6 border border-gray-100 rounded-[2rem] bg-gray-50/50">
                                                <p className="font-bold text-emerald-950 text-sm">Situation: {item.s}</p>
                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                                    <div className="p-4 bg-red-50/50 rounded-xl border border-red-50">
                                                        <p className="text-[10px] font-bold text-red-400 uppercase mb-1">Tightening</p>
                                                        <p className="text-xs text-red-900 italic">{item.t}</p>
                                                    </div>
                                                    <div className="p-4 bg-emerald-50/50 rounded-xl border border-emerald-50">
                                                        <p className="text-[10px] font-bold text-emerald-600 uppercase mb-1">Softening</p>
                                                        <p className="text-xs text-emerald-900 font-medium">{item.soft}</p>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                    <div className="flex gap-4 pt-4">
                                        <button onClick={() => goTo(2)} className="px-6 py-4 text-gray-400 font-bold hover:text-emerald-900">Back</button>
                                        <button onClick={() => goTo(4)} className="flex-1 bg-emerald-900 text-white font-bold py-5 rounded-2xl hover:bg-emerald-800 shadow-lg">Personal Language Tracker</button>
                                    </div>
                                </div>
                            )}

                            {/* STEP 4: Personal Worksheet */}
                            {step === 4 && (
                                <div className="space-y-6">
                                    <h2 className="text-2xl font-bold text-emerald-900">Language Awareness Practice</h2>
                                    <p className="text-sm text-gray-400 italic">Catch one "tightening" thought you've had recently and practice softening it.</p>
                                    
                                    <div className="space-y-6">
                                        <div>
                                            <label className="block text-xs font-bold text-emerald-600 uppercase mb-2 tracking-widest">1. Tightening language I noticed:</label>
                                            <textarea 
                                                className="w-full border-2 border-emerald-50 p-5 rounded-2xl h-24 focus:border-emerald-400 outline-none transition-all text-sm"
                                                placeholder="e.g. I should be further along by now..."
                                                value={formData.tightened}
                                                onChange={e => setFormData({...formData, tightened: e.target.value})}
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-emerald-600 uppercase mb-2 tracking-widest">2. How I could soften it:</label>
                                            <textarea 
                                                className="w-full border-2 border-emerald-50 p-5 rounded-2xl h-24 focus:border-emerald-400 outline-none transition-all text-sm"
                                                placeholder="e.g. I notice I am still learning this at my own pace."
                                                value={formData.softened}
                                                onChange={e => setFormData({...formData, softened: e.target.value})}
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-emerald-600 uppercase mb-2 tracking-widest">3. What I noticed in my body when I softened it:</label>
                                            <input 
                                                className="w-full border-2 border-emerald-50 p-5 rounded-2xl focus:border-emerald-400 outline-none transition-all text-sm"
                                                placeholder="e.g. My shoulders dropped, I took a deeper breath."
                                                value={formData.bodyResponse}
                                                onChange={e => setFormData({...formData, bodyResponse: e.target.value})}
                                            />
                                        </div>
                                    </div>

                                    <div className="flex gap-4 pt-8">
                                        <button onClick={() => goTo(3)} className="px-6 py-4 text-gray-400 font-bold hover:text-emerald-900">Back</button>
                                        <button onClick={() => goTo(5)} className="flex-1 bg-emerald-900 text-white font-bold py-5 rounded-2xl hover:bg-emerald-800 shadow-lg">Finalize Log</button>
                                    </div>
                                </div>
                            )}

                            {/* STEP 5: Export */}
                            {step === 5 && (
                                <div className="text-center fade-in flex flex-col flex-1">
                                    <div className="bg-emerald-100 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6 text-emerald-600 font-bold text-2xl">✓</div>
                                    <h2 className="text-3xl font-bold text-emerald-950 mb-4">Practice Logged</h2>
                                    <p className="text-gray-500 mb-10 text-lg leading-relaxed italic">"Invite curiosity, not correction. Small shifts create big changes."</p>
                                    
                                    <div className="text-left p-10 border-2 border-emerald-50 rounded-[2.5rem] mb-10 bg-white shadow-sm print-block">
                                        <div className="border-b border-emerald-100 pb-6 mb-8 flex justify-between items-end">
                                            <div>
                                                <h3 className="font-bold uppercase tracking-[0.2em] text-[10px] text-emerald-800 mb-1">Healing with Yvonne</h3>
                                                <h4 className="text-xl font-bold text-emerald-950">Language Awareness Log</h4>
                                            </div>
                                            <p className="text-gray-400 text-[10px] uppercase font-bold tracking-widest">{new Date().toLocaleDateString()}</p>
                                        </div>
                                        
                                        <div className="space-y-8 text-sm">
                                            <div>
                                                <p className="text-[10px] font-bold text-red-400 uppercase tracking-widest mb-2">Tightened Thought (Stressed)</p>
                                                <p className="text-gray-600 line-through">"{formData.tightened || 'None recorded'}"</p>
                                            </div>
                                            <div className="p-6 bg-emerald-50/50 rounded-3xl border border-emerald-50">
                                                <p className="text-[10px] font-bold text-emerald-700 uppercase tracking-widest mb-2">Softened Shift (Safe)</p>
                                                <p className="text-emerald-900 font-bold italic leading-relaxed">"{formData.softened || 'None recorded'}"</p>
                                            </div>
                                            <div>
                                                <p className="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2">Physiological Response</p>
                                                <p className="text-gray-800 font-medium">"{formData.bodyResponse || 'Quiet observation'}"</p>
                                            </div>
                                        </div>

                                        <p className="mt-14 italic text-emerald-600 text-[9px] text-center border-t border-emerald-50 pt-6">© 2025 Healing with Yvonne | "Curiosity, not correction."</p>
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 no-print pb-12 mt-auto">
                                        <button onClick={() => window.print()} className="bg-emerald-950 text-white font-bold py-5 rounded-2xl flex items-center justify-center gap-2 shadow-xl hover:bg-emerald-900 transition-all">
                                            <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clipRule="evenodd" /></svg>
                                            Download Analysis PDF
                                        </button>
                                        <button onClick={() => location.reload()} className="border-2 border-emerald-200 text-emerald-800 font-bold py-5 rounded-2xl hover:bg-emerald-50 transition-all">
                                            Start New Practice
                                        </button>
                                    </div>
                                </div>
                            )}

                        </div>

                        {/* Footer Branding */}
                        <div className="mt-12 text-center no-print">
                            <p className="text-gray-300 text-[10px] tracking-[0.4em] uppercase font-bold">&copy; 2025 Healing with Yvonne</p>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
